name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Stops an older deploy from replacing a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Pages lets browsers cache files for 10 minutes. New file URLs make a
      # new page also get new code, so the version shown is the code that runs.
      - name: Set version
        run: |
          sha=$(git rev-parse --short HEAD)
          sed -i -E "s/Version dev/Version $sha/; s/(app\.js|style\.css)\"/\1?v=$sha\"/" index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
